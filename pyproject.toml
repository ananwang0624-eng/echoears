[project]
name = "echoears"
version = "0.1.0"
description = "Listen to ultrasonic echoes — ICU-10201 distance profiles as sound"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
